<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1600px; height: 900px; overflow: hidden;
    font-family: Inter, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(120% 90% at 50% 0%, #2a86ff 0%, #0068e5 45%, #0049a6 100%);
    color: #fff; position: relative;
  }
  .glow { position: absolute; width: 900px; height: 900px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.16), rgba(255,255,255,0) 60%);
    left: 350px; top: 260px; }
  .top { position: absolute; top: 70px; left: 0; right: 0; text-align: center; }
  .top img { height: 64px; }
  h1 { margin: 34px auto 0; font-size: 50px; line-height: 1.15; font-weight: 700;
    letter-spacing: -0.5px; max-width: 1100px; }
  .sub { margin-top: 16px; font-size: 24px; opacity: .88; }
  .shot { position: absolute; left: 50%; transform: translateX(-50%);
    top: 395px; width: 1180px; border-radius: 18px 18px 0 0; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0, 20, 60, .45); border: 6px solid rgba(255,255,255,.35); border-bottom: 0; }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="top">
    <img src="../../contentstudio-website-v2/public/images/brand-assets/logos/cs_logo_white.png" alt="ContentStudio">
    <h1>Plan, create, publish and analyze social content in one place</h1>
    <div class="sub">AI social media management for agencies, brands and teams</div>
  </div>
  <div class="shot">
    <img src="../../contentstudio-website-v2/public/images/brand-assets/app-screenshots/planner.webp" alt="">
  </div>
</body>
</html>
