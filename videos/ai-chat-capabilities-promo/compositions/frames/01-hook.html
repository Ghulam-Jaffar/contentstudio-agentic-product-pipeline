    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      (function () {
        const FID = "01-hook";
        const $ = (id) => document.getElementById(FID + "-" + id);
        const tl = gsap.timeline({ paused: true });

        const textEl = $("text");
        const typedEl = $("label-typed");
        const stackEl = $("stack");
        const moverEl = $("composer-move");
        const composerEl = $("composer");
        const blurNode = $("streak-blur");

        // ---- Scene 1 (0–0.7s): smooth typewriter lead-in "Your day:" ----
        const LABEL = "Your day:";
        const typeP = { p: 2 };
        const writeType = () => {
          typedEl.textContent = LABEL.slice(0, Math.min(LABEL.length, Math.floor(typeP.p)));
        };
        writeType();
        tl.to(typeP, { p: LABEL.length, duration: 0.42, ease: "none", onUpdate: writeType }, 0.04);
        tl.fromTo($("caret"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 0.3);

        // ---- Scene 2 (0.7–3.51s): vertical spring-ticker, one roll per VO word ----
        const ITEM_HEIGHT = 130;
        const ROLL_TIMES = [0.72, 1.38, 2.12, 2.78];
        const springs = ROLL_TIMES.map(() => ({ p: 0 }));
        const applyTicker = () => {
          const sum = springs.reduce((a, s) => a + s.p, 0);
          stackEl.style.transform = "translateY(" + (-sum * ITEM_HEIGHT) + "px)";
        };
        applyTicker();
        springs.forEach((s, i) => {
          tl.to(s, { p: 1, duration: 0.5, ease: "back.out(1.4)", onUpdate: applyTicker }, ROLL_TIMES[i]);
        });

        // ---- Scene 3 (3.51–4.56s): composer crash-in + reactive displacement + motion blur ----
        const STAGE_W = 1920;
        const INTRUDER_TILT = 8;
        const VICTIM_FRACTION = 0.45;
        const VICTIM_KICK_DEG = 6;
        const FADE_IN_SHARPNESS = 6;
        const PEAK_BLUR = 24;
        const driver = { p: 0 };
        const applyCollision = () => {
          const p = driver.p;
          // Intruder (composer): off-stage right -> center, tilt settles to 0
          const ix = STAGE_W * (1 - p);
          const irot = -INTRUDER_TILT * (1 - p);
          moverEl.style.transform = "translateX(" + ix + "px) rotate(" + irot + "deg)";
          moverEl.style.opacity = String(Math.min(1, p * FADE_IN_SHARPNESS));
          // Directional blur rides the same eased driver: velocity of power2.out ~ sqrt(1 - p)
          const blur = PEAK_BLUR * Math.sqrt(Math.max(0, 1 - p));
          blurNode.setAttribute("stdDeviation", blur.toFixed(3) + " 0");
          // Victim (text group): shoved left, completes at VICTIM_FRACTION
          const vp = Math.min(1, p / VICTIM_FRACTION);
          textEl.style.transform = "translateX(" + (-STAGE_W * vp) + "px) rotate(" + (-VICTIM_KICK_DEG * vp) + "deg)";
          textEl.style.opacity = String(1 - vp);
        };
        applyCollision();
        tl.to(driver, { p: 1, duration: 1.05, ease: "power2.out", onUpdate: applyCollision }, 3.51);

        // ---- Scene 4 (4.56–5.845s): hero alone, eyebrow, subtle jitter settling to zero ----
        tl.fromTo($("eyebrow-line"), { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 4.6);
        tl.fromTo($("eyebrow-text"), { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 4.66);

        const IDLE_START = 4.62;
        const IDLE_DUR = 5.845 - IDLE_START;
        const FADE_FRAC = 0.4;
        const phase = { p: 0 };
        const TWO_PI = Math.PI * 2;
        const applyIdle = () => {
          const t = phase.p / TWO_PI; // 0 -> 1 across idle
          const env = t < 1 - FADE_FRAC ? 1 : Math.max(0, (1 - t) / FADE_FRAC);
          const s = 1 + (Math.sin(phase.p * 1.6) * 0.006 + Math.sin(phase.p * 3.7) * 0.003) * env;
          const r = (Math.sin(phase.p * 2.3) * 0.22) * env;
          composerEl.style.transform = "scale(" + s + ") rotate(" + r + "deg)";
        };
        applyIdle();
        tl.to(phase, { p: TWO_PI, duration: IDLE_DUR, ease: "none", onUpdate: applyIdle }, IDLE_START);

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
