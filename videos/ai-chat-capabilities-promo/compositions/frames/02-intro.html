    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        // ---- build greeting characters (deterministic) ----
        var greet = document.getElementById("intro02-greeting");
        var text = "Good afternoon, Alex!";
        var chars = [];
        for (var i = 0; i < text.length; i++) {
          var s = document.createElement("span");
          s.className = "intro02-ch";
          s.textContent = text[i];
          greet.appendChild(s);
          chars.push(s);
        }
        var gcaret = document.createElement("span");
        gcaret.className = "intro02-gcaret";
        greet.appendChild(gcaret);

        // ---- Scene 1 (0–2.11s): composer (handoff, at rest) → window card morph upward ----
        // window rect: x 365..1555, y 130..770 ; composer rect: x 432..1488, y 504..616
        tl.fromTo("#intro02-window",
          { clipPath: "inset(374px 67px 154px 67px round 56px)", opacity: 0 },
          { clipPath: "inset(374px 67px 154px 67px round 56px)", opacity: 1, duration: 0.12, ease: "none" }, 0.1);
        tl.to("#intro02-window",
          { clipPath: "inset(0px 0px 0px 0px round 14px)", duration: 0.75, ease: "power3.inOut" }, 0.2);

        tl.fromTo("#intro02-header", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.75);
        tl.fromTo("#intro02-divider", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 0.8);

        // greeting caret appears, then types character by character
        tl.fromTo(gcaret, { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.85);
        var typeStart = 0.95, perChar = 0.05;
        for (var c = 0; c < chars.length; c++) {
          tl.set(chars[c], { opacity: 1 }, typeStart + c * perChar);
        }
        var typeEnd = typeStart + chars.length * perChar; // ~2.0s
        // brief blink, then caret retires before the pills
        tl.set(gcaret, { opacity: 0 }, typeEnd + 0.15);
        tl.set(gcaret, { opacity: 1 }, typeEnd + 0.4);
        tl.set(gcaret, { opacity: 0 }, typeEnd + 0.65);

        // ---- Scene 2 (2.11–5.38s): starter pills pop in on each spoken verb ----
        var pills = [
          ["#intro02-pill-post", 2.25],
          ["#intro02-pill-image", 2.85],
          ["#intro02-pill-video", 3.1],
          ["#intro02-pill-carousel", 3.6],
          ["#intro02-pill-analytics", 4.25],
          ["#intro02-pill-inbox", 4.85]
        ];
        for (var p = 0; p < pills.length; p++) {
          tl.fromTo(pills[p][0],
            { opacity: 0, scale: 0.6, y: 14 },
            { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(2.2)" }, pills[p][1]);
        }

        // slow continuous push-in under the shot (one camera move)
        tl.fromTo("#intro02-world", { scale: 1 }, { scale: 1.035, duration: 4.9, ease: "power1.inOut" }, 2.1);

        // ---- Scene 3 (5.38–7.02s): caret blinks in composer, send glows once ----
        tl.fromTo("#intro02-placeholder", { x: 0 }, { x: 10, duration: 0.25, ease: "power2.out" }, 5.38);
        var blinkOn = true;
        for (var t = 5.4; t < 7.0; t += 0.4) {
          tl.set("#intro02-ccaret", { opacity: blinkOn ? 1 : 0 }, t);
          blinkOn = !blinkOn;
        }
        tl.fromTo("#intro02-glow", { opacity: 0, scale: 1 }, { opacity: 0.9, scale: 1.25, duration: 0.3, ease: "power2.out" }, 5.7);
        tl.to("#intro02-glow", { opacity: 0, scale: 1.7, duration: 0.6, ease: "power2.out" }, 6.0);
        tl.fromTo("#intro02-send", { scale: 1 }, { scale: 1.08, duration: 0.3, ease: "power2.out" }, 5.7);
        tl.to("#intro02-send", { scale: 1, duration: 0.5, ease: "power2.inOut" }, 6.0);

        // pad timeline to full duration
        tl.set({}, {}, 7.019);

        window.__timelines["02-intro"] = tl;
      })();
