  <script>
    (function () {
      var ID = "04-images";
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      function q(n) { return root.getElementsByClassName(ID + "-" + n)[0]; }
      function qa(n) { return Array.prototype.slice.call(root.getElementsByClassName(ID + "-" + n)); }

      var PROMPT = "Autumn latte flat lay for Bean & Co.";
      var typed = q("typed");
      var chars = [];
      for (var i = 0; i < PROMPT.length; i++) {
        var s = document.createElement("span");
        s.textContent = PROMPT[i];
        s.style.display = "none";
        typed.appendChild(s);
        chars.push(s);
      }

      var D = 5.568;
      var tl = gsap.timeline({ paused: true });

      /* Scene 1 — header copy + window (hero visible by 0.5s) */
      tl.fromTo(q("rule"), { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.0);
      tl.fromTo(q("eyebrow"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.04);
      tl.fromTo(q("headline"), { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.fromTo(q("win"), { opacity: 0, y: 40, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 0.0);

      /* mode chips light up blue one by one */
      qa("chip").forEach(function (c, k) {
        var t = 0.3 + k * 0.12;
        tl.fromTo(c, { scale: 0.9 }, { scale: 1, duration: 0.3, ease: "back.out(2.5)" }, t);
        tl.fromTo(c, { backgroundColor: "#ffffff", color: "#6b7280", borderColor: "rgba(107, 114, 128, 0.3)" },
                     { backgroundColor: "#1f6bff", color: "#ffffff", borderColor: "#1f6bff", duration: 0.16, ease: "power1.out" }, t);
      });

      /* prompt types character by character */
      var tType0 = 0.62, tType1 = 1.4;
      tl.set(q("ph"), { display: "none" }, tType0);
      tl.fromTo(q("send"), { backgroundColor: "rgba(31, 107, 255, 0.15)" }, { backgroundColor: "#1f6bff", duration: 0.12 }, tType0);
      chars.forEach(function (c, k) {
        tl.set(c, { display: "inline" }, tType0 + (tType1 - tType0) * (k / (chars.length - 1)));
      });

      /* caret blink (explicit sets, solid while typing) */
      for (var b = 0.5; b < D; b += 0.5) {
        if (b > 0.55 && b < 1.7) continue;
        tl.set(q("caret"), { opacity: (Math.round(b / 0.5) % 2) ? 0 : 1 }, b);
      }
      tl.set(q("caret"), { opacity: 1 }, tType0);

      /* send: press dip, composer clears, bubble posts */
      var tSend = 1.5;
      tl.fromTo(q("send"), { scale: 1 }, { scale: 0.84, duration: 0.07, ease: "power2.in" }, tSend);
      tl.to(q("send"), { scale: 1, duration: 0.22, ease: "back.out(3)" }, tSend + 0.07);
      tl.set(typed, { display: "none" }, 1.6);
      tl.set(q("ph"), { display: "inline" }, 1.6);
      tl.to(q("send"), { backgroundColor: "rgba(31, 107, 255, 0.15)", duration: 0.15 }, 1.6);
      tl.fromTo(q("bubble"), { opacity: 0, y: 40, scale: 0.96, transformOrigin: "100% 100%" },
                             { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power3.out" }, 1.58);

      /* Scene 2 — Working shimmer, then tiles resolve */
      tl.fromTo(q("avatar"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, 1.72);
      tl.fromTo(q("status"), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.2, ease: "power2.out" }, 1.76);
      tl.fromTo(q("status"), { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 0.42, ease: "none" }, 1.78);
      tl.to(q("status"), { opacity: 0, duration: 0.14, ease: "power1.in" }, 2.16);

      var order = ["t1", "t2", "t3", "t4"];
      order.forEach(function (n, k) {
        var tile = q(n);
        var skel = tile.getElementsByClassName(ID + "-skel")[0];
        var img = tile.getElementsByClassName(ID + "-img")[0];
        tl.fromTo(skel, { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out" }, 2.12 + k * 0.05);
        var t = 2.22 + k * 0.24;
        tl.fromTo(img, { opacity: 0, scale: 1.08, filter: "blur(22px)" },
                       { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.55, ease: "power2.out" }, t);
      });

      /* slow continuous push-in on the window, under the build */
      tl.fromTo(q("win"), { scale: 1 }, { scale: 1.015, duration: D - 1.7, ease: "sine.inOut", immediateRender: false }, 1.7);

      /* Scene 3 — stat pill springs beside the window */
      tl.fromTo(q("stat"), { opacity: 0, scale: 0.6, y: 20, transformOrigin: "0% 50%" },
                           { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "back.out(2)" }, 3.34);
      qa("stat-num").forEach(function (n, k) {
        tl.fromTo(n, { scale: 0.5 }, { scale: 1, duration: 0.45, ease: "back.out(3)" }, 3.42 + k * 0.12);
      });

      /* cursor glides onto the hero tile, tile lifts, action row appears */
      tl.fromTo(q("cursor"), { opacity: 0, x: 760, y: 560 }, { opacity: 1, x: 760, y: 560, duration: 0.12 }, 3.6);
      tl.to(q("cursor"), { x: 250, y: 330, duration: 0.5, ease: "power3.inOut" }, 3.66);
      tl.fromTo(q("t1"), { scale: 1, y: 0 }, { scale: 1.05, y: -6, duration: 0.4, ease: "back.out(1.8)" }, 4.08);
      tl.fromTo(q("ring"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 4.08);
      tl.fromTo(q("shade"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 4.12);
      qa("act").forEach(function (a, k) {
        tl.fromTo(a, { opacity: 0, y: 14, scale: 0.9, transformOrigin: "0% 50%" },
                     { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, 4.2 + k * 0.12);
      });

      /* hold to the end (no exit) */
      tl.set({}, {}, D);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
