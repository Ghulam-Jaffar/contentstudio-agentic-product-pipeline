    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var D = 5.035;
        var tl = gsap.timeline({ paused: true });

        // ---- ambient side glows (un-triggered soft bloom) ----
        tl.fromTo("#mentions05-glow-a", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, 0);
        tl.fromTo("#mentions05-glow-b", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, 0.15);
        tl.fromTo("#mentions05-glow-c", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 1.0, ease: "power2.out" }, 3.05);

        // ---- Scene 1 (0–1.41s): title slides down, split-tilt entry, inner-edge badges ----
        tl.fromTo("#mentions05-header", { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0);

        var TILT = 14, OVER = 9, SLIDE = 380;
        tl.fromTo("#mentions05-card-left",
          { x: -SLIDE, rotateY: TILT + OVER, scale: 0.85, opacity: 0 },
          { x: 0, rotateY: TILT, scale: 1, opacity: 1, duration: 0.85, ease: "power3.out" }, 0.15);
        tl.fromTo("#mentions05-card-right",
          { x: SLIDE, rotateY: -TILT - OVER, scale: 0.85, opacity: 0 },
          { x: 0, rotateY: -TILT, scale: 1, opacity: 1, duration: 0.85, ease: "power3.out" }, 0.35);

        tl.fromTo("#mentions05-plus", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.8);

        // the one overshoot: inner-edge badges
        tl.fromTo("#mentions05-badge-left", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.8)" }, 0.9);
        tl.fromTo("#mentions05-badge-right", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.8)" }, 1.15);

        // phase-opposed idle float (separate layer, no yoyo/repeat)
        tl.fromTo("#mentions05-float-left", { y: 0 }, { y: -6, duration: 0.85, ease: "sine.inOut", immediateRender: false }, 1.05);
        tl.to("#mentions05-float-left", { y: 4, duration: 1.1, ease: "sine.inOut" }, 1.9);
        tl.fromTo("#mentions05-float-right", { y: 0 }, { y: 6, duration: 0.85, ease: "sine.inOut", immediateRender: false }, 1.05);
        tl.to("#mentions05-float-right", { y: -4, duration: 1.1, ease: "sine.inOut" }, 1.9);

        // ---- Scene 2 (1.41–3.02s): composer types the prompt, mentions as blue chips ----
        tl.fromTo("#mentions05-composer", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 1.3);

        var seg0 = document.getElementById("mentions05-seg-0");
        var seg1 = document.getElementById("mentions05-seg-1");
        var chip0 = document.getElementById("mentions05-chip-0");
        var chip1 = document.getElementById("mentions05-chip-1");
        var cursor = document.getElementById("mentions05-cursor");
        var S0 = "Put the logo from ";
        var S1 = " on the label of ";
        var TOTAL = S0.length + 1 + S1.length + 1; // chips count as one atomic unit
        var T_TYPE0 = 1.5, T_TYPE1 = 2.8;
        var CHIP0_U = S0.length + 1, CHIP1_U = TOTAL;
        var CHIP0_T = T_TYPE0 + (CHIP0_U / TOTAL) * (T_TYPE1 - T_TYPE0);
        var CHIP1_T = T_TYPE0 + (CHIP1_U / TOTAL) * (T_TYPE1 - T_TYPE0);

        function chipScale(t, t0) {
          var p = Math.min(1, Math.max(0, (t - t0) / 0.22));
          var e = 1 - Math.pow(1 - p, 3);
          return 0.6 + 0.4 * e;
        }

        function render(t) {
          var u = 0;
          if (t >= T_TYPE0) u = Math.min(TOTAL, Math.floor(((t - T_TYPE0) / (T_TYPE1 - T_TYPE0)) * TOTAL));
          seg0.textContent = S0.substring(0, Math.min(u, S0.length));
          var c0 = u >= CHIP0_U;
          chip0.style.display = c0 ? "inline-block" : "none";
          chip0.style.transform = "scale(" + chipScale(t, CHIP0_T).toFixed(4) + ")";
          var s1n = Math.max(0, Math.min(S1.length, u - CHIP0_U));
          seg1.textContent = S1.substring(0, s1n);
          var c1 = u >= CHIP1_U;
          chip1.style.display = c1 ? "inline-block" : "none";
          chip1.style.transform = "scale(" + chipScale(t, CHIP1_T).toFixed(4) + ")";
          // deterministic blink: solid while typing, square-wave otherwise
          var typing = t >= T_TYPE0 && t <= T_TYPE1 + 0.05;
          cursor.style.opacity = (typing || Math.sin(t * Math.PI * 2 / 0.7) > 0) ? "1" : "0";
        }

        var driver = { t: 0 };
        tl.fromTo(driver, { t: 0 }, {
          t: D, duration: D, ease: "none",
          onUpdate: function () { render(driver.t); }
        }, 0);
        render(0);

        // mentioned card's badge acknowledges its chip
        tl.fromTo("#mentions05-badge-right", { scale: 1 }, { scale: 1.14, duration: 0.15, ease: "power2.out", immediateRender: false }, CHIP0_T);
        tl.to("#mentions05-badge-right", { scale: 1, duration: 0.3, ease: "power2.inOut" }, CHIP0_T + 0.15);
        tl.fromTo("#mentions05-badge-left", { scale: 1 }, { scale: 1.14, duration: 0.15, ease: "power2.out", immediateRender: false }, CHIP1_T);
        tl.to("#mentions05-badge-left", { scale: 1, duration: 0.3, ease: "power2.inOut" }, CHIP1_T + 0.15);

        // send press
        tl.fromTo("#mentions05-send", { scale: 1 }, { scale: 0.88, duration: 0.1, ease: "power2.out" }, 2.9);
        tl.to("#mentions05-send", { scale: 1, duration: 0.3, ease: "power3.out" }, 3.0);

        // ---- Scene 3 (3.02–5.04s): cards converge + tuck behind, result springs up ----
        tl.to("#mentions05-wing-left", { x: 210, scale: 0.8, opacity: 0.55, duration: 0.65, ease: "power3.inOut" }, 3.02);
        tl.to("#mentions05-wing-right", { x: -210, scale: 0.8, opacity: 0.55, duration: 0.65, ease: "power3.inOut" }, 3.02);
        tl.to("#mentions05-plus", { scale: 0.4, opacity: 0, duration: 0.3, ease: "power2.in" }, 3.02);

        tl.fromTo("#mentions05-result",
          { y: 70, scale: 0.55, opacity: 0 },
          { y: 0, scale: 1, opacity: 1, duration: 0.75, ease: "back.out(1.3)" }, 3.18);
        tl.fromTo("#mentions05-result-tag", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 3.65);

        // sparkle accents around the result
        var sparkAt = [3.45, 3.55, 3.62, 3.7];
        for (var i = 0; i < 4; i++) {
          tl.fromTo("#mentions05-spark-" + i, { scale: 0, opacity: 0 }, { scale: 1, opacity: 0.9, duration: 0.3, ease: "power3.out" }, sparkAt[i]);
          tl.to("#mentions05-spark-" + i, { scale: 0.5, opacity: 0.35, duration: 0.8, ease: "power2.out" }, sparkAt[i] + 0.3);
        }

        // quiet hold drift on the hero
        tl.to("#mentions05-result", { y: -8, duration: 1.0, ease: "sine.inOut" }, 3.95);

        tl.set({}, {}, D);
        window.__timelines["05-mentions"] = tl;
      })();
    </script>
