    <script>
      (function () {
        var FID = "07-carousel";
        var root = document.querySelector('[data-composition-id="' + FID + '"]');
        function q(name) { return root.querySelector("." + CSS.escape(FID + "-" + name)); }
        function qa(name) { return Array.prototype.slice.call(root.querySelectorAll("." + CSS.escape(FID + "-" + name))); }

        // build per-character spans for the typed prompt (synchronous, deterministic)
        var PROMPT = "Make a 6 slide LinkedIn carousel about our autumn menu";
        var typed = q("typed");
        var chars = [];
        for (var i = 0; i < PROMPT.length; i++) {
          var b = document.createElement("b");
          b.textContent = PROMPT[i];
          typed.appendChild(b);
          chars.push(b);
        }

        var tl = gsap.timeline({ paused: true });

        // macro camera: slow steady push underneath the whole shot
        tl.fromTo(q("cam"), { scale: 1 }, { scale: 1.03, duration: 4.864, ease: "none" }, 0);

        // ---- Scene 1 (0 - 1.36): header + prompt types and sends ----
        tl.fromTo(q("eyebrow"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0);
        tl.fromTo(qa("line"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out", stagger: 0.08 }, 0.05);
        tl.fromTo(q("composer"), { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.12);

        tl.set(q("placeholder"), { display: "none" }, 0.32);
        var typeStart = 0.34, typeEnd = 0.98;
        var step = (typeEnd - typeStart) / chars.length;
        chars.forEach(function (c, k) { tl.set(c, { display: "inline" }, typeStart + k * step); });

        // send: press-compress then spring back
        tl.fromTo(q("send"), { scale: 1 }, { scale: 0.86, duration: 0.08, ease: "power2.in" }, 1.0);
        tl.to(q("send"), { scale: 1, duration: 0.3, ease: "back.out(3)" }, 1.08);
        tl.set(q("typed"), { display: "none" }, 1.08);
        tl.set(q("placeholder"), { display: "inline" }, 1.08);
        tl.fromTo(q("bubble"), { y: 24, scale: 0.96, opacity: 0, transformOrigin: "100% 100%" },
          { y: 0, scale: 1, opacity: 1, duration: 0.36, ease: "power3.out" }, 1.08);

        // ---- Scene 2 (1.36 - 3.31): viewer arrives, swipes 1 -> 2 -> 3 ----
        var counts = qa("count");
        var overlays = qa("overlay");
        tl.fromTo(q("viewer"), { y: 60, scale: 0.9, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 1.36);
        tl.set([counts[1], counts[2]], { opacity: 0, y: 14 }, 0);
        tl.fromTo(overlays[0], { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 1.62);

        // swipe to slide 2
        tl.fromTo(q("track"), { x: 0 }, { x: -529, duration: 0.45, ease: "power3.inOut" }, 2.02);
        tl.to(counts[0], { y: -14, opacity: 0, duration: 0.18, ease: "power2.in" }, 2.16);
        tl.fromTo(counts[1], { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.24, ease: "power3.out" }, 2.3);
        tl.fromTo(overlays[1], { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.36, ease: "power3.out" }, 2.36);

        // swipe to slide 3
        tl.to(q("track"), { x: -1058, duration: 0.45, ease: "power3.inOut" }, 2.66);
        tl.to(counts[1], { y: -14, opacity: 0, duration: 0.18, ease: "power2.in" }, 2.8);
        tl.fromTo(counts[2], { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.24, ease: "power3.out" }, 2.94);
        tl.fromTo(overlays[2], { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.36, ease: "power3.out" }, 3.0);

        // ---- Scene 3 (3.31 - 4.864): six slides fan out in an arc behind the viewer; hold ----
        tl.to(q("viewer"), { y: 50, scale: 0.8, duration: 0.6, ease: "power2.inOut" }, 3.31);
        var angles = [-20, -12, -4, 4, 12, 20];
        qa("fan").forEach(function (card, k) {
          tl.fromTo(card, { rotation: 0, scale: 0.85, opacity: 0 },
            { rotation: angles[k], scale: 1, opacity: 1, duration: 0.62, ease: "power3.out" }, 3.36 + k * 0.05);
        });
        // quiet settle on the hold: number badges pop in sequence
        tl.fromTo(qa("num"), { scale: 0.4, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.2)", stagger: 0.06 }, 3.7);

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
