<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Inter+Tight:wght@600;700;800&family=Playfair+Display:wght@800;900&family=JetBrains+Mono:wght@500;600&display=block" rel="stylesheet">
<style>
:root{--p:#1f6bff;--p50:#eef4ff;--ink:#1d1d1f;--mute:#6e6e73;--line:#e6e8ec;--img:#8b5cf6;--vid:#f97316}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#f5f5f7;font-family:Inter,"Noto Sans",Ubuntu,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.stage{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:0}
#bgDark{background:#050507;opacity:0}
.blob{position:absolute;border-radius:50%;filter:blur(110px)}
.scene{position:absolute;inset:0;display:none;will-change:transform,opacity,filter}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.tight{font-family:"Inter Tight",Inter,sans-serif}
.mono{font-family:"JetBrains Mono","Ubuntu Mono",monospace}
svg.i{flex:none}
.w{display:inline-block;white-space:pre}

/* copy blocks */
.copy{position:absolute;width:600px}
.eyebrow{font-size:26px;font-weight:700;margin-bottom:22px;display:inline-block;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.h{font-family:"Inter Tight",Inter,sans-serif;font-size:80px;font-weight:700;letter-spacing:-2.8px;line-height:1.02}
.sub{font-size:27px;color:var(--mute);line-height:1.45;margin-top:30px;font-weight:500}
.dark .h{color:#f5f5f7}.dark .sub{color:#a1a1a6}
.toph{position:absolute;left:0;right:0;text-align:center}
.toph .h{font-size:72px}

/* window */
.win{position:absolute;background:#fff;border-radius:28px;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 50px 120px -40px rgba(20,30,70,.38),0 12px 34px -12px rgba(20,30,70,.14);overflow:hidden}
.whead{height:72px;display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid #eef0f3;font-size:21px;font-weight:700;color:#111827}
.wlogo{width:44px;height:44px;border-radius:50%;background:#e8f4ff;color:#2aa2e6;display:flex;align-items:center;justify-content:center}
.sp{flex:1}
.hic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#374151}
.spk{background:#ecfdf3;color:#22c55e}
.newchat{background:var(--p);color:#fff;border-radius:12px;height:44px;padding:0 18px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:18px}
.wbody{position:absolute;top:72px;left:0;right:0;bottom:214px;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 28px);mask-image:linear-gradient(transparent,#000 28px)}
.nocomp .wbody{bottom:0}
.stack{padding:30px 40px 0}
.m{height:0;overflow:hidden}
.mi{padding-bottom:22px}
.mi.u{display:flex;justify-content:flex-end}
.ub{max-width:78%;background:#eef5ff;border-radius:18px;padding:14px 22px;font-size:21px;color:#111827;line-height:1.4;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prose{font-size:21px;line-height:1.55;color:#1f2937;margin-bottom:16px}
.prose b{color:#111827}

/* timeline */
.tlh{display:flex;align-items:center;gap:10px;font-size:19px;color:#6b7280;font-weight:500;height:30px}
.tlh .lbl{background:linear-gradient(90deg,#9ca3af 0%,#9ca3af 40%,#e5e7eb 50%,#9ca3af 60%,#9ca3af 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.tld{display:flex;gap:3px}.tld i{width:6px;height:6px;border-radius:50%;background:#f87171;display:block}
.tlrow{display:flex;align-items:center;gap:14px;font-size:19px;color:#6b7280;height:40px}
.tlrow .tm{margin-left:auto;font-size:16px;color:#6b7280}
.tlrow .ic{color:#9ca3af;display:flex}
.tlrows{padding-top:6px}

/* composer */
.cwrap{position:absolute;left:30px;right:30px;bottom:26px}
.comp{position:relative}
.glow{position:absolute;inset:-12px;border-radius:36px;background:linear-gradient(100deg,#ffb4c9,#ead9ff 45%,#b6ecff);filter:blur(24px);opacity:.8}
.cin{position:relative;background:#fff;border-radius:24px;padding:16px 18px 14px;box-shadow:0 0 0 1px rgba(0,0,0,.05)}
.chips{display:flex;gap:12px;align-items:center;height:44px}
.mchip{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;border:1.5px dashed;font-weight:600;font-size:17px;color:#1f2937;background:#fff}
.mchip.img{border-color:#c4b5fd}.mchip.img svg{color:#8b5cf6}
.mchip.vid{border-color:#fdba74}.mchip.vid svg{color:#f97316}
.opt{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;background:#f3f4f6;font-size:16px;font-weight:600;color:#374151;opacity:0}
.field{min-height:58px;display:flex;align-items:center;flex-wrap:wrap;font-size:21px;padding:10px 4px;line-height:1.5;color:#111827;position:relative}
.ph{color:#9ca3af;position:absolute;left:4px}
.caret{display:inline-block;width:2px;height:26px;background:#111827;margin-left:1px}
.tools{display:flex;align-items:center;gap:12px;height:48px}
.tb{width:44px;height:44px;border-radius:11px;background:#eef2f7;color:#475569;display:flex;align-items:center;justify-content:center}
.dv{width:1px;height:28px;background:#e5e7eb}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px;color:#1f2937}
.tog{width:42px;height:24px;border-radius:12px;background:#e5e7eb;position:relative}
.tog i{position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);display:block}
.mic{color:#111;display:flex;margin-right:6px}
.send{width:50px;height:50px;border-radius:14px;background:#a9c5ff;color:#fff;display:flex;align-items:center;justify-content:center}
.tok{display:inline-flex;align-items:center;gap:6px;background:#f3edff;color:#7c3aed;border-radius:8px;padding:0 10px;font-weight:600;margin:0 3px;height:34px}
.tok img,.tok .th{width:24px;height:24px;border-radius:5px;overflow:hidden}
.stok{background:var(--p50);color:var(--p);border-radius:8px;padding:0 10px;font-weight:600;margin-right:6px;height:34px;display:inline-flex;align-items:center}

/* table */
.tbl{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tr{display:grid;grid-template-columns:1fr 120px 190px 150px;align-items:center;gap:16px;padding:0 20px;height:62px;border-top:1px solid #f0f1f4;font-size:18px;color:#1f2937}
.tr.hd{height:48px;border-top:0;background:#f9fafb;font-size:15px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.8px}
.tr .cap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf{display:flex;gap:4px}
.pb{width:28px;height:28px;border-radius:50%;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.ig{background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)}.li{background:#0a66c2}.fb{background:#1877f2}.xx{background:#111}.tt{background:#111;box-shadow:inset -2px 0 #25f4ee,inset 2px 0 #fe2c55}.gg{background:#fff;color:#4285f4;box-shadow:inset 0 0 0 1.5px #e5e7eb}
.st{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:999px;font-size:15px;font-weight:700;width:max-content}
.st.g{background:#e8f7ee;color:#15803d}.st.a{background:#fff5e6;color:#c2410c}.st.n{background:#f3f4f6;color:#4b5563}

/* confirm card */
.cc{border:1px solid var(--line);border-radius:20px;padding:22px 24px;background:#fff;box-shadow:0 12px 30px -18px rgba(0,0,0,.25)}
.cch{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700;margin-bottom:16px}
.cch .pill{font-size:14px;font-weight:700;color:var(--p);background:var(--p50);border-radius:999px;padding:4px 12px}
.ccrow{display:flex;gap:18px;align-items:center;padding:12px 0;border-top:1px solid #f1f2f4}
.ccrow .th{width:92px;height:92px;border-radius:14px;overflow:hidden;flex:none}
.ccrow .t1{font-size:15px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.6px}
.ccrow .t2{font-size:20px;font-weight:600;margin:4px 0 8px}
.ccf{display:flex;gap:12px;margin-top:16px;align-items:center;height:48px}
.btn{height:46px;padding:0 22px;border-radius:12px;font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);color:#374151;background:#fff}
.btn.pri{background:var(--p);color:#fff;border-color:var(--p)}
.done{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;color:#15803d}
.done .ck{width:32px;height:32px;border-radius:50%;background:#22c55e;color:#fff;display:flex;align-items:center;justify-content:center}

/* grids / media */
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:600px}
.gi{position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;background:#f3f4f6}
.gi .art,.art{position:absolute;inset:0}
.shim{position:absolute;inset:0;background:linear-gradient(110deg,#eef0f5 20%,#f9fafc 40%,#eef0f5 60%);background-size:300% 100%}
.abar{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;opacity:0}
.abar span{white-space:nowrap;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-radius:10px;height:38px;padding:0 12px;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:#111827;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.stat{display:flex;gap:44px;margin-top:40px}
.stat div{font-size:20px;color:var(--mute);font-weight:600}
.stat b{display:block;font-family:"Inter Tight";font-size:72px;letter-spacing:-2px;color:var(--ink);line-height:1}

/* tiles + charts */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.tile{border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.tile .k{font-size:16px;font-weight:600;color:#6b7280}
.tile .v{font-family:"Inter Tight";font-size:44px;font-weight:700;letter-spacing:-1px;margin:6px 0 4px}
.tile .d{font-size:16px;font-weight:700;color:#16a34a}
.chart{border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.chart .ct{font-size:17px;font-weight:700;color:#374151;display:flex;gap:20px;align-items:center}
.lg{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:#6b7280}
.lg i{width:22px;height:4px;border-radius:2px;display:block}
.bars .br{display:grid;grid-template-columns:120px 1fr 80px;align-items:center;gap:14px;height:40px;font-size:17px;font-weight:600;color:#374151}
.bars .bt{height:18px;border-radius:9px;background:linear-gradient(90deg,#1f6bff,#6aa4ff)}
.bars .bv{text-align:right;color:#6b7280}

/* inbox */
.ib{display:flex;gap:16px;align-items:center;padding:14px 18px;border:1px solid var(--line);border-radius:16px;margin-bottom:10px}
.ib .av{width:48px;height:48px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:18px;position:relative}
.ib .av .pb{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;font-size:10px;border:2px solid #fff}
.ib .nm{font-size:18px;font-weight:700}
.ib .nm small{font-weight:500;color:#9ca3af;font-size:15px;margin-left:8px}
.ib .tx{font-size:18px;color:#4b5563;margin-top:2px}
.stars{color:#f59e0b;letter-spacing:2px;font-size:16px}
.stars .off{color:#e5e7eb}
.quote{background:#f9fafb;border-radius:14px;padding:14px 18px;font-size:18px;color:#4b5563;margin-bottom:14px}
.draft{font-size:20px;line-height:1.5;color:#111827;border-left:3px solid var(--p);padding-left:16px}

/* carousel viewer */
.cv{width:520px}
.cvs{position:relative;width:520px;height:650px;border-radius:18px;overflow:hidden;background:#f3f4f6}
.cvt{position:absolute;left:0;top:0;height:100%;display:flex}
.cvc{position:absolute;left:18px;top:18px;background:rgba(17,24,39,.55);color:#fff;font-size:15px;font-weight:700;border-radius:999px;padding:5px 12px}
.cva{position:absolute;top:50%;margin-top:-24px;width:48px;height:48px;border-radius:10px;background:rgba(17,24,39,.45);color:#fff;display:flex;align-items:center;justify-content:center}
.cvf{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:18px;color:#6b7280;font-weight:500}
.dots{display:flex;gap:6px}.dots i{width:9px;height:9px;border-radius:5px;background:#d1d5db;display:block}

/* slides 520x650 */
.sl{position:relative;width:520px;height:650px;flex:none;overflow:hidden}
.sl .br{position:absolute;left:36px;top:34px;font-size:19px;font-weight:800;letter-spacing:.2px}
.sl .ey{font-size:16px;font-weight:800;letter-spacing:2.4px}
.sl .ti{font-family:"Inter Tight";font-weight:800;letter-spacing:-1.8px;line-height:1.02}
.sl .ft{position:absolute;left:36px;right:36px;bottom:30px;display:flex;justify-content:space-between;font-size:16px;font-weight:600}
.clean{background:#fff}
.clean .dotsbg{position:absolute;right:0;top:0;width:260px;height:200px;background-image:radial-gradient(#e7c9bd 1.5px,transparent 1.5px);background-size:14px 14px;-webkit-mask-image:linear-gradient(225deg,#000,transparent 70%);mask-image:linear-gradient(225deg,#000,transparent 70%)}
.hl{background:#ffd8c6;padding:0 8px;border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.bold{background:#f3ede2}
.dark2{background:radial-gradient(circle at 30% 20%,#2a241c,#0d0c0a 70%)}
.retro{background:#f2c14e}
.data{background:#eef4ff}

/* menu */
.menu{position:absolute;left:0;width:620px;background:#fff;border-radius:20px;padding:14px;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 30px 60px -20px rgba(0,0,0,.3);opacity:0;transform-origin:bottom left}
.mg{font-size:14px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:1.2px;padding:10px 14px 6px}
.mr{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:12px;font-size:20px;font-weight:600;color:#111827}
.mr small{display:block;font-size:16px;color:#6b7280;font-weight:500}
.mr .mi2{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.mr.hi{background:var(--p50)}

/* plan grid */
.pg{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;width:1300px}
.pc{background:#fff;border-radius:18px;padding:16px;height:230px;box-shadow:0 0 0 1px rgba(0,0,0,.05),0 18px 40px -24px rgba(0,0,0,.3);text-align:left;opacity:0}
.pc .dy{font-size:15px;font-weight:800;color:#9ca3af;letter-spacing:1px}
.pc .dn{font-family:"Inter Tight";font-size:34px;font-weight:700;margin:2px 0 12px}
.pc .pl{font-size:13px;font-weight:800;border-radius:8px;padding:4px 8px;display:inline-block;margin-bottom:8px}
.pc .pt{font-size:16px;font-weight:600;color:#374151;line-height:1.35}

/* more cards */
.mc{position:absolute;width:800px;height:340px;background:#fff;border-radius:28px;padding:34px 38px;box-shadow:0 0 0 1px rgba(0,0,0,.05),0 40px 90px -40px rgba(20,30,70,.35);overflow:hidden}
.mc .k{font-size:18px;font-weight:700;letter-spacing:.2px}
.mc .t{font-family:"Inter Tight";font-size:40px;font-weight:700;letter-spacing:-1px;margin:6px 0 22px}
.row{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:16px;padding:14px 18px;font-size:19px}

/* cursor */
#cursor{position:absolute;left:0;top:0;width:40px;height:40px;z-index:50;opacity:0;pointer-events:none}
#ripple{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border:3px solid rgba(31,107,255,.6);z-index:49;opacity:0}
</style></head>
<body><div class="stage" id="stage">
<div class="bg" id="bgLight">
  <div class="blob" id="bl1" style="width:900px;height:900px;background:#cfe0ff;opacity:.7"></div>
  <div class="blob" id="bl2" style="width:800px;height:800px;background:#ffd6e4;opacity:.55"></div>
  <div class="blob" id="bl3" style="width:700px;height:700px;background:#e6dcff;opacity:.6"></div>
</div>
<div class="bg" id="bgDark">
  <div class="blob" id="d1" style="width:900px;height:900px;background:#3b2bff;opacity:.35"></div>
  <div class="blob" id="d2" style="width:800px;height:800px;background:#ff3d8b;opacity:.22"></div>
</div>
<div id="scenes"></div>
<div id="ripple"></div>
<svg id="cursor" viewBox="0 0 24 24"><path d="M5 2.5l14.5 9.2-6.6 1.3-3.6 6.5z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>
</div>

<script>
/* ---------- fonts: load every face up front so hidden scenes render ---------- */
['400 20px Inter','500 20px Inter','600 20px Inter','700 20px Inter','800 20px Inter','900 20px Inter','600 20px "Inter Tight"','700 20px "Inter Tight"','800 20px "Inter Tight"','800 20px "Playfair Display"','900 20px "Playfair Display"','500 20px "JetBrains Mono"','600 20px "JetBrains Mono"'].forEach(f=>document.fonts.load(f));
/* ---------- icons ---------- */
const P={
bot:'<rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 8V4H8"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/>',
history:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
sparkle:'<path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"/>',
plus:'<path d="M5 12h14M12 5v14"/>',
imgplus:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
video:'<path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/>',
clip:'<path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>',
slash:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9.5 15.5l5-7"/>',
book:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>',
up:'<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',
sendp:'<path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9z"/>',
pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
chart:'<path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>',
users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
down:'<path d="m6 9 6 6 6-6"/>',right:'<path d="m9 6 6 6-6 6"/>',left:'<path d="m15 6-6 6 6 6"/>',
check:'<path d="M20 6 9 17l-5-5"/>',
grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',
bulb:'<path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>',
file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
wand:'<path d="m15 4-11 11 3 3 11-11z"/><path d="M19 3v4M17 5h4"/>',
link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',

/* ---------- procedural art ---------- */
function rnd(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280}}
let UID=0;
function flatlay(v){
  const u=v+'_'+(UID++);
  const bgs=['#e8d5bf','#d8bfa2','#efdfcb','#caa98a'],r=rnd(v+3),bg=bgs[v%4],rot=[0,24,-18,40][v%4];
  let leaves='';const lc=['#d9622b','#c2410c','#e8a13a','#b4441e','#a3551f'];
  for(let k=0;k<7;k++){const a=r()*6.28,d=150+r()*40;leaves+=`<g transform="translate(${200+Math.cos(a)*d} ${200+Math.sin(a)*d}) rotate(${r()*360})"><path d="M0 -30 C18 -16 18 16 0 30 C-18 16 -18 -16 0 -30Z" fill="${lc[k%5]}"/><path d="M0 -26 L0 26" stroke="rgba(0,0,0,.18)" stroke-width="2"/></g>`}
  return `<svg class="art" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice"><defs><radialGradient id="lg${u}" cx="30%" cy="25%" r="90%"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></radialGradient><filter id="sh${u}"><feDropShadow dx="6" dy="10" stdDeviation="9" flood-opacity=".28"/></filter></defs>
  <rect width="400" height="400" fill="${bg}"/>
  <g transform="rotate(${rot} 200 200)">${leaves}
  <g filter="url(#sh${u})"><rect x="40" y="250" width="120" height="16" rx="8" fill="#8b4a22" transform="rotate(-25 100 258)"/><rect x="52" y="272" width="110" height="15" rx="7" fill="#9c5528" transform="rotate(-20 100 280)"/>
  <circle cx="210" cy="190" r="112" fill="#f7f2ea"/><circle cx="210" cy="190" r="80" fill="#fff"/><circle cx="210" cy="190" r="64" fill="#6b3a1f"/>
  <path d="M210 214 C170 188 184 158 210 176 C236 158 250 188 210 214Z" fill="#e9cfaa" opacity=".9"/>
  <rect x="296" y="120" width="54" height="130" rx="18" fill="#3a2215" transform="rotate(18 323 185)"/><rect x="300" y="160" width="46" height="44" rx="4" fill="#efe3cf" transform="rotate(18 323 185)"/></g></g>
  <rect width="400" height="400" fill="url(#lg${u})"/></svg>`}

  <rect width="400" height="400" fill="url(#bgb${u})"/><ellipse cx="200" cy="352" rx="110" ry="16" fill="#000" opacity=".16"/>
  <rect x="178" y="62" width="44" height="34" rx="6" fill="#141414"/><path d="M180 96 h40 v26 c0 10 40 22 40 50 v168 a14 14 0 0 1-14 14 h-92 a14 14 0 0 1-14-14 v-168 c0-28 40-40 40-50z" fill="url(#bb${u})"/>

  ${withLogo?`<g transform="translate(200 240)"><circle r="30" fill="#1f3d2b"/><ellipse rx="10" ry="15" fill="#e9d7b5" transform="rotate(25)"/><path d="M-4 -12 C4 -4 -4 4 4 12" stroke="#1f3d2b" stroke-width="3" fill="none" transform="rotate(25)"/></g>`:''}</svg>`}

/* ---------- motion helpers ---------- */
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const p=(t,s,d)=>cl((t-s)/d);
const expo=x=>x>=1?1:1-Math.pow(2,-10*x);
const cub=x=>1-Math.pow(1-x,3);
const io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const spring=x=>x<=0?0:x>=1?1:1-Math.exp(-6.5*x)*Math.cos(8.5*x)*(1-x*.0);
const lerp=(a,b,k)=>a+(b-a)*k;
function fx(el,o,x=0,y=0,s=1,b=0,extra=''){el.style.opacity=o;el.style.transform=`translate(${x}px,${y}px) scale(${s}) ${extra}`;el.style.filter=b>.05?`blur(${b}px)`:'none'}
function rise(el,t,s,d=.8,dist=40,blur=12){if(typeof el==='string')el=$(el);const k=expo(p(t,s,d));fx(el,cl(k*1.4),0,(1-k)*dist,1,(1-k)*blur);return k}
function pop(el,t,s,d=.7){if(typeof el==='string')el=$(el);const k=spring(p(t,s,d));fx(el,cl(p(t,s,d)*3),0,0,.6+.4*k,0);return k}
function words(el,t,s,st=.07,d=.8){if(typeof el==='string')el=$(el);[...el.querySelectorAll('.w')].forEach((w,i)=>{const k=expo(p(t,s+i*st,d));w.style.opacity=cl(k*1.3);w.style.transform=`translateY(${(1-k)*38}px)`;w.style.filter=k<.98?`blur(${(1-k)*14}px)`:'none'})}
function copyAnim(id,t,s){rise(id+'-e',t,s,.8,20,8);words(id+'-h',t,s+.15);const sb=$(id+'-s');if(sb)rise(sb,t,s+.75,.9,24,10)}
function grow(id,t,s,d=.6){const el=$(id);const inner=el.firstElementChild;const k=cub(p(t,s,d));el.style.height=(inner.offsetHeight*k)+'px';const k2=expo(p(t,s+.05,d));fx(inner,cl(k2*1.3),0,(1-k2)*18,1,(1-k2)*6);return k}
function scroll(w){const b=$(w+'-body'),s=$(w+'-st');s.style.transform=`translateY(${-Math.max(0,s.offsetHeight-b.clientHeight)}px)`}
const tw=(str,t,s,cps=26)=>str.slice(0,Math.max(0,Math.floor((t-s)*cps)));
function input(id,html,t,active){$(id+'-tx').innerHTML=html;$(id+'-ph').style.display=html?'none':'block';$(id+'-ca').style.opacity=(active||Math.floor(t*2.2)%2===0)?1:0;$(id+'-ca').style.display=active===null?'none':'inline-block';$(id+'-send').style.background=html?'#1f6bff':'#a9c5ff'}
function sendPress(id,t,at){const k=p(t,at,.25);$(id+'-send').style.transform=`scale(${1-.12*Math.sin(k*Math.PI)})`}
function tl(id,t,s,rowT,done,label,rowsN){ // timeline animation
  const el=$(id);const inner=el.firstElementChild;
  const rows=$(id+'-r');
  if(rowsN){const openK=cub(p(t,s,.4)),shutK=cub(p(t,done,.5));rows.style.height=(rows.firstElementChild.offsetHeight*openK*(1-shutK))+'px';
    for(let i=0;i<rowsN;i++){const r=$(id+'-r'+i);const k=expo(p(t,rowT[i],.5));fx(r,k,(1-k)*-10,0,1,(1-k)*4)}}
  const k=cub(p(t,s,.4));el.style.height=(inner.offsetHeight*k)+'px';inner.style.opacity=k;
  const working=t<done;$(id+'-l').textContent=working?'Working':label;
  $(id+'-l').style.backgroundPosition=working?`${(-t*120)%300}% 0`:'0 0';
  $(id+'-l').style.backgroundImage=working?'':'none';$(id+'-l').style.color=working?'transparent':'#6b7280';
  $(id+'-d').style.display=working?'flex':'none';
  [...$(id+'-d').children].forEach((d,i)=>d.style.transform=`translateY(${Math.sin(t*9-i*.9)*3}px)`);
  $(id+'-c').innerHTML=working?I('down',18):I('right',18);
